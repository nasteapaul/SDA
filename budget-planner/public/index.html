<!doctype html>
<html lang="en-GB">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Budget Planner</title>
  <meta name="description" content="Track income and spending in RON, sync your bank, and plan your savings goals.">
  <meta name="theme-color" content="#f5f6f8" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#0b0c0f" media="(prefers-color-scheme: dark)">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Budget">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/inter-latin.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/app.css">
  <link rel="stylesheet" href="/collapse.css">
</head>
<body>
  <div id="login" class="login" hidden>
    <form class="login-card" id="login-form">
      <img src="/icons/icon.svg" alt="" width="56" height="56">
      <h1>Budget Planner</h1>
      <p class="muted">Enter the password set on your home server.</p>
      <input type="password" name="password" autocomplete="current-password" placeholder="Password" required>
      <button class="btn primary" type="submit">Unlock</button>
      <p class="form-error" id="login-error" role="alert"></p>
    </form>
  </div>

  <div class="shell" id="app" hidden>
    <!-- Nav icons: same paths as public/js/icons.js (overview, transactions, goals, plan, settings). -->
    <nav class="sidebar" aria-label="Main">
      <div class="brand"><img src="/icons/icon.svg" alt="" width="28" height="28"><span>Budget</span></div>
      <a href="#overview" data-nav="overview"><span class="nav-ico"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><rect x="3.5" y="3.5" width="7" height="9" rx="2"/><rect x="13.5" y="3.5" width="7" height="5" rx="2"/><rect x="13.5" y="11.5" width="7" height="9" rx="2"/><rect x="3.5" y="15.5" width="7" height="5" rx="2"/></svg></span><span class="nav-label">Overview</span></a>
      <a href="#transactions" data-nav="transactions"><span class="nav-ico"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M7.5 3.5 4 7l3.5 3.5M4 7h12.5M16.5 13.5 20 17l-3.5 3.5M20 17H7.5"/></svg></span><span class="nav-label">Transactions</span></a>
      <a href="#goals" data-nav="goals"><span class="nav-ico"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><circle cx="12" cy="12" r="8.5"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5"/></svg></span><span class="nav-label">Goals</span></a>
      <a href="#plan" data-nav="plan"><span class="nav-ico"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M3.5 17 9 11.5l4 4 7.5-7.5"/><path d="M15 8h5.5v5.5"/></svg></span><span class="nav-label">Plan</span></a>
      <a href="#settings" data-nav="settings"><span class="nav-ico"><svg class="icon" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M10.08 4.85 10.33 2.55H13.67L13.92 4.85A7.4 7.4 0 0 1 15.7 5.59L17.51 4.14 19.86 6.49 18.41 8.3A7.4 7.4 0 0 1 19.15 10.08L21.45 10.33V13.67L19.15 13.92A7.4 7.4 0 0 1 18.41 15.7L19.86 17.51 17.51 19.86 15.7 18.41A7.4 7.4 0 0 1 13.92 19.15L13.67 21.45H10.33L10.08 19.15A7.4 7.4 0 0 1 8.3 18.41L6.49 19.86 4.14 17.51 5.59 15.7A7.4 7.4 0 0 1 4.85 13.92L2.55 13.67V10.33L4.85 10.08A7.4 7.4 0 0 1 5.59 8.3L4.14 6.49 6.49 4.14 8.3 5.59A7.4 7.4 0 0 1 10.08 4.85Z"/><circle cx="12" cy="12" r="3"/></svg></span><span class="nav-label">Settings</span></a>
      <div class="sync-pill" id="sync-pill" role="status" aria-live="polite"></div>
    </nav>

    <main class="content">
      <header class="topbar">
        <h1 id="view-title">Overview</h1>
        <div class="topbar-actions">
          <span class="sync-pill compact" id="sync-pill-mobile" role="status"></span>
          <button class="btn primary add-btn" data-action="add-tx" type="button"><svg class="icon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg>Add</button>
        </div>
      </header>
      <section id="view" class="view" tabindex="-1"></section>
    </main>

    <button class="fab" data-action="add-tx" type="button" aria-label="Add transaction"><svg class="icon" width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" focusable="false"><path d="M12 5v14M5 12h14"/></svg></button>
  </div>

  <dialog id="modal" class="modal" aria-labelledby="modal-title">
    <form method="dialog" id="modal-form" novalidate></form>
  </dialog>

  <div id="tooltip" class="tooltip" role="tooltip" hidden></div>
  <div id="toast" class="toast" role="status" aria-live="polite" hidden></div>

  <script type="module" src="/js/app.js"></script>
</body>
</html>
