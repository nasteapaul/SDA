# IG DEMO day-trading bots in the cloud, no PC needed.
# multi (default): opening range breakout on EUR/USD and GBP/USD
#   at the London open and Australia 200 at the Sydney open. Each run trades the sessions
#   opening in the next hours, closes positions whose session is over, then exits. Safe to
#   start any number of times: up to 3 losing trades per market per day, kept in the state file.
# trend: daily trend following on Bitcoin and Ether, once a day after 00:00 UTC, ON PAPER
#   (lib/papertrend.js, Coinbase prices, no orders): the IG UK demo refuses crypto CFDs.
#   The IG version (bin/trendbot.js) stays for an account that allows crypto.
# report: the day's trades and the week's summary on Telegram (also sent after the evening
#   multi run on its own).
# run / flatten: the older single-market DAX bot (no edge in the research), manual only.
# Does nothing until the IG_API_KEY secret exists. The bot refuses any non-demo account.
name: trading-bot

on:
  # No cron: GitHub ran scheduled starts hours late, after the opening range was gone.
  # Claude routines start the job at each open and for the evening close.
  workflow_dispatch:
    inputs:
      job:
        description: 'multi = multi-market bot, trend = daily Bitcoin/Ether trend bot, report = send today''s and this week''s trade report now, pnl = print every closed trade and the totals since October (log only), replay = raw trade and order history since 12 Oct (log only), run / flatten = old DAX bot, check = test the IG connection and send a Telegram test message'
        default: multi
        type: choice
        options: [multi, trend, report, pnl, replay, run, flatten, check]
      account:
        description: 'IG account id (default XR5HB, the demo CFD account)'
        required: false
        default: ''
      epics:
        description: 'check only: exact epics to print, comma separated'
        required: false
        default: ''
      terms:
        description: 'check only: market names to search, comma separated (no Telegram test)'
        required: false
        default: ''

permissions:
  contents: write   # daily-loss state on the trading-bot-data branch

concurrency:
  # One run at a time: all accounts share one IG login, and switching account in one run
  # logs the other run's session out.
  group: trading-bot
  cancel-in-progress: false

jobs:
  bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    env:
      HAS_IG: ${{ secrets.IG_API_KEY != '' }}
      IG_API_KEY: ${{ secrets.IG_API_KEY }}
      IG_USERNAME: ${{ secrets.IG_USERNAME }}
      IG_PASSWORD: ${{ secrets.IG_PASSWORD }}
      # Its own Telegram bot when TRADING_TELEGRAM_BOT_TOKEN is set; otherwise the signals bot.
      TELEGRAM_BOT_TOKEN: ${{ secrets.TRADING_TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TELEGRAM_SOURCE: ${{ secrets.TRADING_TELEGRAM_BOT_TOKEN != '' && 'TRADING_TELEGRAM_BOT_TOKEN' || 'TELEGRAM_BOT_TOKEN' }}
      BOT_STATE: ${{ github.workspace }}/state/trading-state.json
      BOT_EXIT_AT: '12:05'
      MULTI_STATE: ${{ github.workspace }}/state/multi-state.json
      BOT_RISK_PCT: '1'
      BOT_MAX_DAILY_LOSS_PCT: '3'
      JOB: ${{ github.event.inputs.job || 'multi' }}
      # The bot trades only the Demo-CFD account, not the login's preferred spread-bet one.
      IG_ACCOUNT_ID: ${{ github.event.inputs.account || 'XR5HB' }}
    steps:
      - uses: actions/checkout@v4
        if: env.HAS_IG == 'true'

      - uses: actions/setup-node@v4
        if: env.HAS_IG == 'true'
        with:
          node-version: 22

      - name: Load state
        if: env.HAS_IG == 'true'
        run: |
          if git fetch -q origin trading-bot-data; then
            git worktree add -q state FETCH_HEAD
          else
            git worktree add -q --detach state
            git -C state checkout -q --orphan trading-bot-data
            git -C state rm -rfq . || true
          fi

      - name: Run multi-market bot
        if: env.HAS_IG == 'true' && env.JOB == 'multi'
        # One state file per account: each has its own day start equity and trades.
        run: BOT_STATE="${MULTI_STATE%.json}${IG_ACCOUNT_ID:+-$IG_ACCOUNT_ID}.json" node trading-bot/bin/multibot.js

      - name: Run crypto trend on paper
        if: env.HAS_IG == 'true' && env.JOB == 'trend'
        run: BOT_STATE="state/trend-paper.json" node trading-bot/bin/papertrend.js

      # After the evening multi run that closes US Tech 100 (16:05 New York): the day's trades on Telegram,
      # plus the week's summary on Friday. Sent once a day; job=report sends both now.
      - name: Trade report
        if: always() && env.HAS_IG == 'true' && (env.JOB == 'multi' || env.JOB == 'report')
        env:
          REPORT_FORCE: ${{ env.JOB == 'report' && '1' || '' }}
        run: REPORT_STATE="state/report${IG_ACCOUNT_ID:+-$IG_ACCOUNT_ID}.json" node trading-bot/bin/report.js

      - name: Profit and loss so far
        if: env.HAS_IG == 'true' && env.JOB == 'pnl'
        run: node trading-bot/bin/pnl.js

      - name: Raw trade history
        if: env.HAS_IG == 'true' && env.JOB == 'replay'
        run: node trading-bot/bin/replay.js

      - name: Run DAX bot
        if: env.HAS_IG == 'true' && env.JOB == 'run'
        run: node trading-bot/bin/bot.js

      - name: Check IG connection
        if: env.HAS_IG == 'true' && env.JOB == 'check'
        env:
          CHECK_EPICS: ${{ github.event.inputs.epics }}
          CHECK_TERMS: ${{ github.event.inputs.terms }}
          CHECK_CANDLES: ${{ github.event.inputs.epics != '' && '1' || '' }}
        run: node trading-bot/bin/check.js

      - name: Close open positions
        if: env.HAS_IG == 'true' && env.JOB == 'flatten'
        run: |
          node trading-bot/bin/flatten.js

      - name: Save state
        if: always() && env.HAS_IG == 'true'
        run: |
          cd state
          [ -n "$(ls ./*.json 2>/dev/null)" ] || exit 0
          git add -A .
          git -c user.name=trading-bot -c user.email=actions@users.noreply.github.com commit -qm "state" || exit 0
          # Another account's run may have saved its own file meanwhile.
          git -c user.name=trading-bot -c user.email=actions@users.noreply.github.com pull -q --rebase origin trading-bot-data 2>/dev/null || true
          git push -q origin HEAD:refs/heads/trading-bot-data
