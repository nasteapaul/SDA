name: earnings-research
# Do US stocks keep rising for weeks after a strong earnings report? (stock-signals/bin/earnings-research.js)
# Needs SEC EDGAR and Yahoo prices, which the runner can reach; results are in the job log.
on:
  workflow_dispatch:
  push:
    paths: ['stock-signals/bin/earnings-research.js', '.github/workflows/earnings-research.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - run: node stock-signals/bin/earnings-research.js
        env:
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
