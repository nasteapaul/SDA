name: recent-research
# The London/Sydney ORB and its exit variants on 2020–today 1-minute data from HistData.com
# (trading-bot/bin/histdata-download.js, bin/exit-research.js); results are in the job log.
on:
  workflow_dispatch:
  push:
    paths: ['trading-bot/bin/exit-research.js', 'trading-bot/bin/histdata-download.js', '.github/workflows/recent-research.yml']
jobs:
  research:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - name: Download 1-minute data
        run: node trading-bot/bin/histdata-download.js "$RUNNER_TEMP/data" EURUSD,GBPUSD,AUXAUD 2020
      - name: EUR/USD
        run: node trading-bot/bin/exit-research.js EURUSD "$RUNNER_TEMP/data" EURUSD 2020
      - name: GBP/USD
        run: node trading-bot/bin/exit-research.js GBPUSD "$RUNNER_TEMP/data" GBPUSD 2020
      - name: Australia 200
        run: node trading-bot/bin/exit-research.js AU200 "$RUNNER_TEMP/data" AUXAUD 2020
