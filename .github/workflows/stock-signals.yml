# Stock alerts to Telegram, without a PC. Alerts only: it never trades.
# One run checks SEC filings and press releases every 2 minutes for ~5.5 hours, then starts
# the next run itself (GitHub's own schedule arrives hours late; it stays only as a backup).
# State (what was already read, the alert journal) lives on the "signals-data" branch.
name: stock-signals

on:
  schedule:
    - cron: '7 */3 * * *'
  workflow_dispatch:
    inputs:
      minutes:
        description: 'How long this run keeps checking (minutes)'
        default: '330'

permissions:
  contents: write   # save state to the signals-data branch
  models: read      # free AI summaries through GitHub Models
  actions: write    # start the next run when this one ends

concurrency:
  group: stock-signals
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Load state
        run: |
          if git fetch -q origin signals-data; then
            git worktree add -q state FETCH_HEAD
          else
            git worktree add -q --detach state
            git -C state checkout -q --orphan signals-data
            git -C state rm -rfq . || true
          fi

      - name: Run
        env:
          STATE_DIR: state
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          SEC_CONTACT: ${{ secrets.SEC_CONTACT }}
          GITHUB_TOKEN: ${{ github.token }}
          LOOP_MINUTES: ${{ github.event.inputs.minutes || '330' }}
          INTERVAL_SECONDS: '120'
        run: |
          # Save state every 30 minutes too, so a cancelled run loses little.
          ( while sleep 1800; do bash .github/scripts/save-signals-state.sh || true; done ) &
          saver=$!
          status=0
          node stock-signals/bin/run.js || status=$?
          kill "$saver" 2>/dev/null || true
          exit "$status"

      - name: Save state
        if: always()
        run: bash .github/scripts/save-signals-state.sh

      - name: Start the next run
        # Not after a manual cancel: cancelling a run is how to stop the bot.
        if: ${{ !cancelled() && github.ref == 'refs/heads/master' && (github.event.inputs.minutes || '330') == '330' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run stock-signals.yml --ref master
